name: macomputers

services:
  app:
    build:
      context: .
      target: php
    image: macomputers-app:dev
    restart: unless-stopped
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - default
      - infra

  web:
    build:
      context: .
      target: web
    image: macomputers-web:dev
    restart: unless-stopped
    depends_on:
      - app
    networks:
      - default
      - infra

volumes:
  app_storage:

networks:
  infra:
    name: infra_infra_net
    external: true
